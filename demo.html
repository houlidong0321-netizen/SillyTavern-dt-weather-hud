<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Transparent HUD Widget · Preview v3</title>
<link rel="stylesheet" href="style.css" />
<style>
    /* ============================================================
       独立预览页（非 SillyTavern 环境）
       直接引用扩展真实的 style.css，因此这里看到的就是实际效果。
       本页使用【示例假数据】，仅用于确认视觉与交互。
       ============================================================ */
    html, body {
        margin: 0; padding: 0; height: 100%;
        background: radial-gradient(ellipse at 30% 20%, #1b2735 0%, #090a0f 60%, #000 100%);
        overflow: hidden;
    }
    .bg-grid {
        position: fixed; inset: 0; pointer-events: none;
        background-image:
            linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
            linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size: 42px 42px;
    }
    /* 预览页把悬浮窗放在偏右位置，方便看到向左展开的侧栏 */
    #dt_weather_hud_panel { top: 90px; right: 90px; }

    .hint {
        position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
        color: rgba(255,255,255,0.35);
        font-family: var(--dt-hud-font); font-size: 12px; letter-spacing: 1px;
        text-align: center; line-height: 1.7;
    }
    .side-switch {
        position: fixed; top: 20px; left: 20px;
        font-family: var(--dt-hud-font); font-size: 12px;
        color: rgba(255,255,255,0.5); letter-spacing: 1px;
    }
    .side-switch span {
        cursor: pointer; padding: 4px 10px; margin-right: 4px;
        border: 1px solid rgba(255,255,255,0.15); border-radius: 4px;
    }
    .side-switch span.on { color: #fff; border-color: rgba(255,255,255,0.6); }
</style>
</head>
<body>
    <div class="bg-grid"></div>

    <div class="side-switch">
        侧栏方向：<span id="btn-left" class="on">向左</span><span id="btn-right">向右</span>
    </div>

    <div id="dt_weather_hud_panel" class="dt-hud-drawer-left">
        <div class="dt-hud-corner dt-hud-corner-tl"></div>
        <div class="dt-hud-corner dt-hud-corner-br"></div>

        <div class="dt-hud-main" id="dt_weather_hud_main">
            <div class="dt-hud-time-row">
                <span class="dt-hud-hour" id="dt_hud_hour">--</span>
                <span class="dt-hud-colon">:</span>
                <span class="dt-hud-minute" id="dt_hud_minute">--</span>
            </div>
            <div class="dt-hud-date-row">
                <span id="dt_hud_date">----.--.--</span>
                <span class="dt-hud-sep">/</span>
                <span id="dt_hud_weekday">----</span>
            </div>
            <div class="dt-hud-weather-row">
                <span class="dt-hud-weather-icon" id="dt_hud_weather_icon"></span>
                <span id="dt_hud_weather_text">--</span>
                <span class="dt-hud-temp" id="dt_hud_temp"></span>
            </div>
        </div>

        <div class="dt-hud-drawer" id="dt_hud_drawer">
            <div class="dt-hud-drawer-inner">
                <div class="dt-hud-tabs">
                    <div class="dt-hud-tab active" data-tab="calendar">日历</div>
                    <div class="dt-hud-tab" data-tab="scene">场景</div>
                    <div class="dt-hud-tab" data-tab="summary">摘要</div>
                </div>

                <div class="dt-hud-tab-page active" data-page="calendar">
                    <div class="dt-hud-cal-head">
                        <span class="dt-hud-cal-nav" id="dt_hud_cal_prev">‹</span>
                        <span class="dt-hud-cal-title" id="dt_hud_cal_title">----.--</span>
                        <span class="dt-hud-cal-nav" id="dt_hud_cal_next">›</span>
                    </div>
                    <div class="dt-hud-cal-grid" id="dt_hud_cal_grid"></div>
                    <div class="dt-hud-todo-head">
                        <span id="dt_hud_todo_date">选择日期</span>
                        <span class="dt-hud-todo-add" id="dt_hud_todo_add" title="添加待办">＋</span>
                    </div>
                    <div class="dt-hud-todo-list" id="dt_hud_todo_list"></div>
                </div>

                <div class="dt-hud-tab-page" data-page="scene">
                    <div class="dt-hud-section-title">当前地点</div>
                    <div class="dt-hud-location" id="dt_hud_location_text">—</div>
                    <div class="dt-hud-section-title">主要人物着装</div>
                    <div class="dt-hud-outfit-list" id="dt_hud_outfit_list"></div>
                </div>

                <div class="dt-hud-tab-page" data-page="summary">
                    <div class="dt-hud-section-title">章节摘要</div>
                    <div class="dt-hud-chapter-list" id="dt_hud_chapter_list"></div>
                </div>
            </div>
        </div>

        <div class="dt-hud-collapse-btn" id="dt_weather_hud_collapse_btn" title="折叠/展开时间">︿</div>
    </div>

    <div class="hint">
        点击时间区域展开 / 收起侧栏 · 按住时间区域可拖动组件<br>
        以下为示例数据，实际使用时由剧情正文中的数据块自动填充
    </div>

<script>
// ==============================================================
// 预览页脚本：使用示例假数据演示各区域效果
// ==============================================================

const WEEKDAY_CN = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const WEEKDAY_SHORT = ['日','一','二','三','四','五','六'];

const WEATHER_ICONS = {
    sun: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
    cloud: '<svg viewBox="0 0 24 24"><path d="M7 17h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7.1 8.5 4 4 0 0 0 7 17z"/></svg>',
    rain: '<svg viewBox="0 0 24 24"><path d="M7 13h9a3.8 3.8 0 0 0 .4-7.58A5.2 5.2 0 0 0 7.2 4.9 3.8 3.8 0 0 0 7 13z"/><path d="M8 17l-1 2.5M12 17l-1 2.5M16 17l-1 2.5"/></svg>',
    moon: '<svg viewBox="0 0 24 24"><path d="M18 13.5A7 7 0 0 1 9.5 5 7.5 7.5 0 1 0 18 13.5z"/></svg>',
};

const COLOR_TAGS = {
    '红':'#ff5f6d','橙':'#ff9f43','黄':'#ffd93d','绿':'#4ade80',
    '青':'#22d3ee','蓝':'#60a5fa','紫':'#c084fc','灰':'#9ca3af'
};
const tagColor = (t) => COLOR_TAGS[t] || '#9ca3af';

// ---------- 示例数据 ----------
const STORY = {
    date: '2026-08-05',
    time: '09:45',
    weather: '晴',
    temp: '28°C',
    location: '老城区「灰鸽」咖啡馆二楼靠窗座位',
    outfits: [
        { name: '林夏', desc: '米色针织开衫，白衬衫，深蓝色长裙，左手腕银色细链表' },
        { name: '陈默', desc: '深灰色风衣未系扣，黑色高领毛衣，同色长裤' },
    ],
    todos: [
        { date: '2026-08-05', tag: '蓝', text: '与陈默核对旧档案编号', done: true },
        { date: '2026-08-05', tag: '绿', text: '归还图书馆的城建年鉴' },
        { date: '2026-08-08', tag: '红', text: '截止：向委员会提交调查申请' },
        { date: '2026-08-08', tag: '橙', text: '取回冲洗好的胶卷' },
        { date: '2026-08-14', tag: '紫', text: '母亲忌日，前往北郊墓园' },
        { date: '2026-08-20', tag: '青', text: '与匿名来信者约定的碰面日' },
    ],
    chapters: [
        { num: 1, text: '2026-08-05 08:50-09:20 灰鸽咖啡馆。林夏抵达咖啡馆，选定二楼靠窗座位。林夏取出档案袋，核对七份文件编号。陈默于09:05进入，落座对面。林夏情绪由平静转为戒备。' },
        { num: 2, text: '2026-08-05 09:20-09:45 灰鸽咖啡馆二楼。陈默出示一张1998年的施工许可影印件。林夏确认签名栏笔迹与父亲一致。陈默陈述："这份文件本该在十年前就被销毁。"林夏沉默六秒后收起影印件。' },
    ],
};

let cursor = { year: 2026, month: 7 }; // 8月
let selectedDay = '2026-08-05';
let drawerOpen = false;

// ---------- 悬浮窗主体 ----------
function renderMain() {
    const [y, m, d] = STORY.date.split('-').map(Number);
    const [hh, mm] = STORY.time.split(':');
    document.getElementById('dt_hud_hour').textContent = hh;
    document.getElementById('dt_hud_minute').textContent = mm;
    document.getElementById('dt_hud_date').textContent = `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`;
    document.getElementById('dt_hud_weekday').textContent = WEEKDAY_CN[new Date(y, m-1, d).getDay()];
    document.getElementById('dt_hud_weather_icon').innerHTML = WEATHER_ICONS.sun;
    document.getElementById('dt_hud_weather_text').textContent = STORY.weather;
    document.getElementById('dt_hud_temp').textContent = STORY.temp;
}

// ---------- 月历 ----------
function renderCalendar() {
    const { year, month } = cursor;
    document.getElementById('dt_hud_cal_title').textContent = `${year}.${String(month+1).padStart(2,'0')}`;

    const byDate = {};
    STORY.todos.forEach(t => { (byDate[t.date] = byDate[t.date] || []).push(t); });

    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month+1, 0).getDate();

    let html = WEEKDAY_SHORT.map(w => `<div class="dt-hud-cal-cell dt-hud-cal-weekday">${w}</div>`).join('');
    for (let i = 0; i < firstDay; i++) html += '<div class="dt-hud-cal-cell dt-hud-cal-blank"></div>';

    for (let d = 1; d <= daysInMonth; d++) {
        const key = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
        const items = byDate[key] || [];
        const cls = ['dt-hud-cal-cell','dt-hud-cal-day'];
        if (key === STORY.date) cls.push('is-story-today');
        if (key === selectedDay) cls.push('is-selected');
        if (items.length) cls.push('has-todo');
        const dots = items.slice(0,3).map(t => `<i style="background:${tagColor(t.tag)}"></i>`).join('');
        html += `<div class="${cls.join(' ')}" data-date="${key}">
            <span class="dt-hud-cal-num">${d}</span><span class="dt-hud-cal-dots">${dots}</span></div>`;
    }
    document.getElementById('dt_hud_cal_grid').innerHTML = html;
}

// ---------- 待办 ----------
function renderTodos() {
    const head = document.getElementById('dt_hud_todo_date');
    const list = document.getElementById('dt_hud_todo_list');
    if (!selectedDay) {
        head.textContent = '选择日期';
        list.innerHTML = '<div class="dt-hud-todo-empty">点击月历中的日期查看待办</div>';
        return;
    }
    head.textContent = selectedDay.replace(/-/g, '.');
    const items = STORY.todos.filter(t => t.date === selectedDay);
    if (!items.length) {
        list.innerHTML = '<div class="dt-hud-todo-empty">当日暂无待办</div>';
        return;
    }
    list.innerHTML = items.map(t => `
        <div class="dt-hud-todo-item ${t.done ? 'is-done' : ''}">
            <span class="dt-hud-todo-dot" style="background:${tagColor(t.tag)}"></span>
            <span class="dt-hud-todo-text">${t.text}</span>
            <span class="dt-hud-todo-src">剧情</span>
        </div>`).join('');
}

// ---------- 场景 / 摘要 ----------
function renderScene() {
    document.getElementById('dt_hud_location_text').textContent = STORY.location;
    document.getElementById('dt_hud_outfit_list').innerHTML = STORY.outfits.map(o => `
        <div class="dt-hud-outfit-item">
            <div class="dt-hud-outfit-name">${o.name}</div>
            <div class="dt-hud-outfit-desc">${o.desc}</div>
        </div>`).join('');
}

function renderChapters() {
    document.getElementById('dt_hud_chapter_list').innerHTML =
        [...STORY.chapters].reverse().map(c => `
        <div class="dt-hud-chapter-item">
            <div class="dt-hud-chapter-num">CHAPTER ${c.num}</div>
            <div class="dt-hud-chapter-text">${c.text}</div>
        </div>`).join('');
}

// ---------- 交互 ----------
const panel = document.getElementById('dt_weather_hud_panel');
const drawer = document.getElementById('dt_hud_drawer');

drawer.addEventListener('pointerdown', e => e.stopPropagation());
drawer.addEventListener('click', e => e.stopPropagation());

drawer.querySelectorAll('.dt-hud-tab').forEach(tab => {
    tab.addEventListener('click', () => {
        drawer.querySelectorAll('.dt-hud-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const name = tab.dataset.tab;
        drawer.querySelectorAll('.dt-hud-tab-page').forEach(p => {
            p.classList.toggle('active', p.dataset.page === name);
        });
    });
});

document.getElementById('dt_hud_cal_prev').addEventListener('click', () => {
    cursor.month--; if (cursor.month < 0) { cursor.month = 11; cursor.year--; }
    renderCalendar();
});
document.getElementById('dt_hud_cal_next').addEventListener('click', () => {
    cursor.month++; if (cursor.month > 11) { cursor.month = 0; cursor.year++; }
    renderCalendar();
});

document.getElementById('dt_hud_cal_grid').addEventListener('click', (e) => {
    const cell = e.target.closest('.dt-hud-cal-day');
    if (!cell) return;
    selectedDay = cell.dataset.date;
    renderCalendar();
    renderTodos();
});

document.getElementById('dt_weather_hud_collapse_btn').addEventListener('click', (e) => {
    e.stopPropagation();
    panel.classList.toggle('dt-hud-collapsed');
});

// 侧栏方向切换（预览专用）
document.getElementById('btn-left').addEventListener('click', function () {
    panel.classList.add('dt-hud-drawer-left');
    panel.classList.remove('dt-hud-drawer-right');
    this.classList.add('on');
    document.getElementById('btn-right').classList.remove('on');
});
document.getElementById('btn-right').addEventListener('click', function () {
    panel.classList.add('dt-hud-drawer-right');
    panel.classList.remove('dt-hud-drawer-left');
    this.classList.add('on');
    document.getElementById('btn-left').classList.remove('on');
});

// 拖动 + 点击展开（与扩展中逻辑一致：位移超过阈值视为拖动，否则视为点击）
(function () {
    const handle = document.getElementById('dt_weather_hud_main');
    let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;

    handle.addEventListener('pointerdown', (e) => {
        if (e.target.closest('#dt_weather_hud_collapse_btn')) return;
        dragging = true; moved = false;
        panel.classList.add('dt-hud-dragging');
        const r = panel.getBoundingClientRect();
        ox = r.left; oy = r.top; sx = e.clientX; sy = e.clientY;
        handle.setPointerCapture(e.pointerId);
    });

    handle.addEventListener('pointermove', (e) => {
        if (!dragging) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
        if (!moved) return;
        panel.style.left = (ox + dx) + 'px';
        panel.style.top = (oy + dy) + 'px';
        panel.style.right = 'auto';
    });

    const end = () => {
        if (!dragging) return;
        dragging = false;
        panel.classList.remove('dt-hud-dragging');
        if (!moved) {
            drawerOpen = !drawerOpen;
            panel.classList.toggle('dt-hud-drawer-open', drawerOpen);
        }
    };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
})();

renderMain();
renderCalendar();
renderTodos();
renderScene();
renderChapters();
</script>
</body>
</html>
